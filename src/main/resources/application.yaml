server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: flow-manager-upload
              uri: lb://FLOW-MANAGER
              predicates:
                - Path=/api/v1/flow-manager
                - Method=POST
            - id: flow-manager-files-download
              uri: lb://FLOW-MANAGER
              predicates:
                - Path=/api/v1/flow-manager/files/**
                - Method=GET
            - id: flow-manager-status
              uri: lb://FLOW-MANAGER
              predicates:
                - Path=/api/v1/flow-manager/files/*/status
                - Method=GET

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    instance-id: ${spring.application.name}:${random.value}